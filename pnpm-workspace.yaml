# Workspace members and the dependencies allowed to run install scripts.
packages:
  - packages/*
  - tools/test
  - tools/test-daemon
  - tools/eslint-rules
  - tools/style-gate
  - tests/*
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@vitejs/plugin-vue@6.0.10"
  - prettier@3.9.10
  - "@vue/language-core@3.3.13"
  - vue-tsc@3.3.13
