# Release: on a tag v<version>, build the tarball of every target on its own runner, with the MCP bundle validated by the
# official MCPB CLI, smoke-test each (install with curl | sh from a local server, nimbo doctor, a notebook run headless,
# the MCP bundle without and with nimbo, uninstall), then attach the tarballs with the MCP bundle and its server.json
# (the linux-x64 runner's), manifest.json, SHA256SUMS, install.sh and the Homebrew formula to a draft GitHub release,
# which the owner publishes; publishing it lists it in the MCP Registry (mcp-registry.yml).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version
        id: version
        run: |
          version=$(node -e 'import("./packages/core/src/product.ts").then((m) => console.log(m.productVersion))')
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not core's version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: node tools/release/build.mjs --target ${{ matrix.target }}
      - name: Smoke test
        run: bash tools/release/check.sh smoke .release ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimbo-${{ matrix.target }}
          path: |
            .release/download/v${{ steps.version.outputs.version }}/nimbo-*-${{ matrix.target }}.tar.gz
            .release/download/v${{ steps.version.outputs.version }}/nimbo-*-${{ matrix.target }}.json
          if-no-files-found: error
      # The bundle is the same on every platform: one runner's copy is published, with the server.json of its SHA-256.
      - if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimbo-mcpb
          path: |
            .release/download/v${{ steps.version.outputs.version }}/nimbo-mcp-*.mcpb
            .release/download/v${{ steps.version.outputs.version }}/server.json
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          # this job installs nothing: without pnpm on the runner, the action's automatic cache would fail
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Manifest, checksums, installer and formula
        run: node tools/release/manifest.mjs assets
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          gh release create "${GITHUB_REF_NAME}" --draft --title "nimbo ${GITHUB_REF_NAME#v}" \
            --notes "Install: curl -fsSL https://github.com/7sStudio/nimbo/releases/latest/download/install.sh | sh" \
            nimbo-*.tar.gz nimbo-mcp-*.mcpb server.json manifest.json SHA256SUMS install.sh nimbo.rb
